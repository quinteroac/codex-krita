[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krita-codex-service"
version = "0.1.0"
description = "Local service bridge for the Krita Codex extension"
requires-python = ">=3.10"
dependencies = [
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
krita-codex-service = "krita_codex_service.__main__:main"

[tool.setuptools]
package-dir = {"" = "service"}

[tool.setuptools.packages.find]
where = ["service"]
