name: Release Krita Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: PYTHONPATH=service python -m unittest discover -s tests

      - name: Build Krita plugin ZIP
        run: python scripts/package_plugin.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex_krita
          path: dist/codex_krita.zip
          if-no-files-found: error

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/codex_krita.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/codex_krita.zip \
              --title "$RELEASE_TAG" \
              --notes "Krita Codex plugin package. Import codex_krita.zip from Krita with Tools > Scripts > Import Python Plugin from File."
          fi
